<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" id="stage" class="stage" role="img" aria-label="Isometric machine with a large screen. Nine loose data icons drift on the screen. Click the console button, or press s, to assign them into three groups: social, event and reach. Press r to scatter them again." data-fig="groups" viewBox="-191.95 -134.69 461.85 346.39"><style>svg.stage{--navy:#001E62;--red:#DB0A40;--yellow:#FFC72C;--silver:#C4C9D1;--white:#FFFFFF;--panel:#001E62;--recess:#00163f;--ink:#C4C9D1;--ink-hi:#FFFFFF;--accent:#FFC72C;--accent-hi:#FFFFFF;--glass:#00163f;--glass-on:#FFFFFF;--detail:rgba(196,201,209,.55)}

.stage{display:block;width:100%;height:100%;outline:none}
.stage *{vector-effect:non-scaling-stroke}
.face{fill:url(#g-fr);stroke:#00133a;stroke-opacity:.35;stroke-width:.6;stroke-linejoin:round}
.face.sd{fill:url(#g-sd)}
.face.top{fill:url(#g-top)}
.bld .face.sd{fill:url(#g-sdn)}
.face.recess{fill:var(--recess);stroke:none}
.detail{fill:none;stroke:var(--detail);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:4 4}
.label,.scr{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;font-weight:700;letter-spacing:.06em;stroke:none}
.label{fill:var(--white);opacity:.85}
.scr{fill:var(--navy)}
.scr-accent{fill:var(--red)}
.press{cursor:pointer;transition:transform .08s}
.press.down{transform:translate(0,3px)}
.press.lit .face{fill:var(--yellow)}
.press.latched .face.top{fill:var(--yellow)}
.glass{fill:var(--glass);stroke:none}
.glass.hot{fill:var(--white)}
.halo{fill:var(--yellow);opacity:0;transition:opacity .45s;pointer-events:none}
.halo.hot{opacity:.55}
.led{fill:var(--recess);stroke:none}
.led.hot{fill:var(--yellow)}
.wire{fill:none;stroke:var(--silver);stroke-width:2.2;stroke-linecap:round}
.wire.hot{stroke:var(--yellow)}
.wire-under{fill:none;stroke:var(--panel);stroke-width:5}
.pulse{fill:none;stroke:var(--white);stroke-width:3;stroke-linecap:round;stroke-dasharray:60 940;stroke-dashoffset:60;opacity:0}
.pulse.go{animation:iso-pulse 1s linear 1}
@keyframes iso-pulse{0%{stroke-dashoffset:60;opacity:1}99%{opacity:1}100%{stroke-dashoffset:-1000;opacity:0}}
.blink{animation:iso-blink 1.1s steps(1) infinite}
@keyframes iso-blink{0%{opacity:1}50%{opacity:.05}}
.limb{fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mast{fill:none;stroke:var(--silver);stroke-width:1.2}
.ico{fill:none;stroke:var(--navy);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:var(--red);stroke:none}
.ic .face{fill:var(--yellow);stroke:none}
.wins .pn{fill:#00163f;stroke:none;transition:fill .35s}
.wins.lit .pn{fill:var(--yellow)}
.wins.lit .pn.d{fill:var(--yellow);opacity:.6}
.wins.lit .pn.h{fill:var(--white)}
.wins.lit .pn.x{fill:#00163f}
.tag{fill:var(--white);stroke:none}
.sweep{fill:none;stroke:var(--yellow);stroke-width:1.6;stroke-linecap:round}
.person .face.sd{filter:brightness(.78)}
.person .face.top{filter:brightness(1.15)}
.person .legs .face{fill:var(--red)}
.person .torso .face{fill:url(#g-fr2)}
.person.tone-y .torso .face{fill:var(--yellow)}.person.tone-y .limb{stroke:var(--yellow)}
.person.tone-w .torso .face{fill:var(--white)}.person.tone-w .limb{stroke:var(--silver)}
.person.tone-r .torso .face{fill:var(--red)}.person.tone-r .legs .face{fill:var(--navy)}.person.tone-r .limb{stroke:var(--red)}
.person circle.face{fill:var(--silver);stroke:none}
.person path.face{fill:var(--yellow);stroke:none}
.tree{fill:var(--yellow);stroke:none}

[data-fig="groups"] .go{cursor:pointer}[data-fig="groups"] .cell .face{fill:#e9ecf1;transition:fill .4s}[data-fig="groups"] .cell.hot .face{fill:var(--navy)}[data-fig="groups"] .cell .lab{fill:var(--navy);opacity:.55;font-size:5.4px}[data-fig="groups"] .cell.hot .lab{opacity:1;fill:var(--white)}</style><defs>
