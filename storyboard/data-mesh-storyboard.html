<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Mesh Storyboard</title>
<style id="tokens">
:root{--panel:#0c0f14;--page:#07090c;--body:#171c24;--deck:#212836;--line:#a3aebf;--detail:#4d586a;--recess:#0a0d12;--ink:#c8d0dc;--ink-hi:#fff;--glass:#0f141b;--accent:#ffb02e;--accent-hi:#ffe2a6;color-scheme:dark}
:root[data-theme=light]{--panel:#e9ecf0;--page:#f6f7f9;--body:#ffffff;--deck:#eef1f5;--line:#38414e;--detail:#a5aebb;--recess:#d6dbe3;--ink:#2a313b;--ink-hi:#000;--glass:#dfe4ea;color-scheme:light}
:root{--glass-on:color-mix(in srgb,var(--accent) 26%,var(--recess));--accent-dim:color-mix(in srgb,var(--accent) 38%,var(--panel))}
</style>
<style id="vocab">
.stage{display:block;width:100%;height:100%;outline:none}
.stage *{vector-effect:non-scaling-stroke}
.face{fill:var(--body);stroke:var(--line);stroke-width:1;stroke-linejoin:round}
.face.top{fill:var(--deck)}
.face.recess{fill:var(--recess);stroke:var(--detail)}
.detail{fill:none;stroke:var(--detail);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:4 4}
.label,.scr{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;stroke:none}
.label{fill:var(--ink);opacity:.75}
.scr{fill:var(--accent-hi)}
.scr-accent{fill:var(--accent)}
.press{cursor:pointer;transition:transform .08s}
.press.down{transform:translate(0,3px)}
.press.lit .face{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 30%,var(--body))}
.press.latched .face.top{fill:var(--accent-dim);stroke:var(--accent-hi)}
.glass{fill:var(--glass);stroke:var(--line)}
.glass.hot{fill:var(--glass-on);stroke:var(--accent-hi)}
.halo{fill:var(--accent);opacity:0;transition:opacity .45s;pointer-events:none}
.halo.hot{opacity:.5}
.led{fill:var(--detail);stroke:none}
.led.hot{fill:var(--accent-hi)}
.wire{fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire.hot{stroke:var(--accent)}
.wire-under{fill:none;stroke:var(--panel);stroke-width:5}
.pulse{fill:none;stroke:var(--accent-hi);stroke-width:3;stroke-linecap:round;stroke-dasharray:60 940;stroke-dashoffset:60;opacity:0}
.pulse.go{animation:iso-pulse 1s linear 1}
@keyframes iso-pulse{0%{stroke-dashoffset:60;opacity:1}99%{opacity:1}100%{stroke-dashoffset:-1000;opacity:0}}
.blink{animation:iso-blink 1.1s steps(1) infinite}
@keyframes iso-blink{0%{opacity:1}50%{opacity:.05}}
.limb{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mast{fill:none;stroke:var(--line);stroke-width:1.1}
.ico{fill:none;stroke:var(--ink);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
.ico.f{fill:var(--ink)}
.ic .face{transition:stroke .3s}
.ic.hot .face{stroke:var(--accent)}
.ic.hot .ico{stroke:var(--accent-hi)}
.ic.hot .ico.f{fill:var(--accent)}
.wins .pn{fill:var(--recess);stroke:var(--detail);stroke-width:.5;transition:fill .35s}
.wins.lit .pn{fill:var(--accent);stroke:var(--accent-hi)}
.wins.lit .pn.d{opacity:.4}
.wins.lit .pn.h{fill:var(--accent-hi)}
.wins.lit .pn.x{fill:var(--recess);stroke:var(--detail)}
.tag{fill:var(--glass);stroke:var(--line)}
.tag.hot{fill:var(--glass-on);stroke:var(--accent-hi)}
.sweep{fill:none;stroke:var(--accent-hi);stroke-width:1.4;stroke-linecap:round}
</style>
<style id="page">
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{padding:22px 16px;border-right:1px solid var(--detail);display:flex;flex-direction:column;gap:18px}
.brand{font-weight:600;letter-spacing:.02em}.brand span{color:var(--accent)}
#nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#nav button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;padding:7px 10px;border-radius:7px;display:flex;gap:10px;color:var(--ink)}
#nav button:hover{background:var(--deck)}
#nav button[aria-current=true]{background:var(--deck);color:var(--ink-hi);box-shadow:inset 2px 0 var(--accent)}
#nav i{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--accent);opacity:.9;min-width:22px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink-hi)}
.tools button.t{all:unset;cursor:pointer;font-size:12px;padding:4px 9px;border:1px solid var(--detail);border-radius:6px}
.tools button.t:hover{border-color:var(--accent)}
.credit{margin-top:auto;font-size:11px;color:var(--ink);opacity:.55;text-decoration:none}
.credit:hover{opacity:1;color:var(--accent)}
main{padding:20px 24px;min-width:0}
header{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
#figlabel{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.05em;color:var(--ink-hi)}
#figlabel b{color:var(--accent);font-weight:500}
#hint{font-size:12px;opacity:.65}
#stageHolder{position:relative;width:100%;max-width:calc((100vh - 230px)*4/3);min-width:320px;aspect-ratio:4/3;background:var(--panel);border:1px solid var(--detail);border-radius:14px;overflow:hidden}
#stageHolder::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 50%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);opacity:0;transition:opacity .6s;pointer-events:none}
#stageHolder.on::before{opacity:1}
#stage{position:relative}
#readout{position:absolute;right:14px;bottom:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent-hi);opacity:.9;pointer-events:none}
.vo{margin-top:14px;max-width:calc((100vh - 230px)*4/3);min-width:320px}
.vo .shot{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.vo p{margin:4px 0 0;font-size:15px;color:var(--ink-hi)}
.vo small{display:block;margin-top:8px;opacity:.6;font-size:12px}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--detail);padding:14px}#nav{flex-direction:row;overflow-x:auto}#nav button{white-space:nowrap}.credit{margin-top:0}#stageHolder,.vo{max-width:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="fx">
<filter id="bloom" filterUnits="userSpaceOnUse" x="-1500" y="-1500" width="3000" height="3000"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="glow" filterUnits="userSpaceOnUse" x="-1500" y="-1500" width="3000" height="3000"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" filterUnits="userSpaceOnUse" x="-1500" y="-1500" width="3000" height="3000"><feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>
<div class="app">
  <nav class="side" aria-label="Storyboard shots">
    <div class="brand"><span>Data mesh</span> · storyboard</div>
    <ol id="nav"></ol>
    <div class="tools" id="pal"></div>
    <div class="tools"><button class="t" id="theme" type="button">Light / dark</button><button class="t" id="dl" type="button">Download SVG</button></div>
    <a class="credit" href="https://iso-glow.vercel.app" target="_blank" rel="noopener">Made with ISO-GLOW ↗</a>
  </nav>
  <main>
    <header><div id="figlabel"></div><div id="hint"></div></header>
    <div id="stageHolder" class="glow"><svg id="stage" class="stage" tabindex="0"></svg><div id="readout"></div></div>
    <section class="vo"><div class="shot" id="shot"></div><p id="vo"></p><small id="vis"></small></section>
  </main>
</div>
<script>
window.GALLERY = { palette: 'city', autoDemo: true };
const FIGS = [];
const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  const n = v => +v.toFixed(2), n4 = v => +v.toFixed(4);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const P = (x, y, z) => [(x - y) * C, (x + y) * S - z];
  const plane = (O, U, V) => { const o = P(...O), u = P(...U), v = P(...V); return `matrix(${n4(u[0])} ${n4(u[1])} ${n4(v[0])} ${n4(v[1])} ${n4(o[0])} ${n4(o[1])})`; };
  const TOP = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 1, 0]);
  const FRONT = (x, y, z) => plane([x, y, z], [1, 0, 0], [0, 0, -1]);
  const SIDE = (x, y, z) => plane([x, y, z], [0, -1, 0], [0, 0, -1]);
  const pp = p => n(p[0]) + ',' + n(p[1]);
  const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map(p => pp(P(...p))).join(' ')}"/>`;
  const outline = (x, y, w, d, r) => { const o = []; [[x + w - r, y + r, -90], [x + w - r, y + d - r, 0], [x + r, y + d - r, 90], [x + r, y + r, 180]].forEach(([cx, cy, a0]) => { for (let k = 0; k <= 4; k++) { const a = (a0 + k * 22.5) * Math.PI / 180; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } }); return o; };
  const hull = pts => {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = []; p.forEach(q => { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); });
    const up = []; p.slice().reverse().forEach(q => { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); });
    return lo.slice(0, -1).concat(up.slice(0, -1));
  };
  const box = (x, y, z, w, d, h, r = 0, cls = '') => {
    const g = s => cls ? `<g class="${cls}">${s}</g>` : s;
    if (!r) return g(
      poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], 'face') +
      poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], 'face') +
      poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], 'face top'));
    r = Math.min(r, w / 2, d / 2);
    const o = outline(x, y, w, d, r);
    const sil = hull([...o.map(([a, b]) => P(a, b, z)), ...o.map(([a, b]) => P(a, b, z + h))]);
    return g(`<polygon class="face" points="${sil.map(pp).join(' ')}"/><polygon class="face top" points="${o.map(([a, b]) => pp(P(a, b, z + h))).join(' ')}"/>`);
  };
  const rect = (t, w, h, r = 0, cls = 'face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
  const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + P(...p).map(n).join(' ')).join('');
  const slits = (a0, a1, step, b0, b1, vertical = true, cls = 'detail') => {
    let s = ''; for (let a = a0; a <= a1 + 1e-6; a += step) s += vertical
      ? `<line class="${cls}" x1="${n(a)}" y1="${b0}" x2="${n(a)}" y2="${b1}"/>`
      : `<line class="${cls}" x1="${b0}" y1="${n(a)}" x2="${b1}" y2="${n(a)}"/>`;
    return s;
  };
  const frame = (pts, pad = .05) => {
    const pr = pts.map(p => P(...p));
    const x0 = Math.min(...pr.map(p => p[0])), x1 = Math.max(...pr.map(p => p[0])), y0 = Math.min(...pr.map(p => p[1])), y1 = Math.max(...pr.map(p => p[1]));
    const m = Math.max(x1 - x0, (y1 - y0) * 4 / 3) * pad;
    let W = x1 - x0 + 2 * m, H = y1 - y0 + 2 * m;
    if (W / H < 4 / 3) W = H * 4 / 3; else H = W * 3 / 4;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, vb = [cx - W / 2, cy - H / 2, W, H];
    return { P, D: P, TOP, FRONT, SIDE, box, boxc: box, rect, path, poly, vb, viewBox: vb.map(n).join(' ') };
  };
  return { frame, slits, esc, P, TOP, FRONT, SIDE, box, rect, path, n };
})();
</script>
<script>
/* ---- shared helpers for the Data Mesh storyboard figures ---- */
const KINDS = ['heart', 'play', 'bars', 'chat', 'pin', 'ticket', 'cam'];
const ICONS = {
  heart: '<path class="ico f" d="M0 4 C-6 -1 -4.5 -5 0 -2 C4.5 -5 6 -1 0 4Z"/>',
  play: '<path class="ico f" d="M-2.2 -3.4L3.2 0L-2.2 3.4Z"/>',
  bars: '<path class="ico" d="M-3.5 3.5V0M0 3.5V-3M3.5 3.5V-1.5"/>',
  chat: '<path class="ico" d="M-4 -3.5H4V1.5H-0.5L-3 4V1.5H-4Z"/>',
  pin: '<path class="ico" d="M0 4.5L-3 -0.5A3.4 3.4 0 1 1 3 -0.5Z"/><circle class="ico" cx="0" cy="-1.6" r="1"/>',
  ticket: '<path class="ico" d="M-4.5 -2.5H4.5V3H-4.5Z M1 -2.5V3"/>',
  cam: '<rect class="ico" x="-4.5" y="-2.5" width="9" height="6" rx="1"/><circle class="ico" cx="0" cy="0.5" r="1.6"/>',
  coin: '<circle class="ico f" r="3.4"/><path class="ico" d="M0 -1.6V1.6" style="stroke:var(--recess)"/>',
};
const icon = (kind, cls = 'hot') => `<g class="ic ${cls}"><rect class="face" x="-7" y="-7" width="14" height="14" rx="3.5"/>${ICONS[kind]}</g>`;
const seeded = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const f1 = v => (+v).toFixed(2);
const tr = (K, dx, dy, dz = 0) => { const p = K.D(dx, dy, dz); return `translate(${f1(p[0])} ${f1(p[1])})`; };
const setTr = (K, el, dx, dy, dz = 0) => el.setAttribute('transform', tr(K, dx, dy, dz));
const bill = (K, el, x, y, z, s = 1, op = 1) => { const p = K.P(x, y, z); el.setAttribute('transform', `translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(s)})`); el.style.opacity = op; };

/* rounded ground plate with inset line + screws */
function plate(K, x, y, w, d, h = 6, o = {}) {
  let s = K.box(x, y, 0, w, d, h, o.r === undefined ? 10 : o.r);
  s += `<g transform="${K.TOP(x, y, h)}"><rect class="detail" x="6" y="6" width="${w - 12}" height="${d - 12}" rx="5"/>`;
  if (!o.noscrew) [[11, 11], [w - 11, 11], [11, d - 11], [w - 11, d - 11]].forEach(([a, b]) => { s += `<circle class="face recess" cx="${a}" cy="${b}" r="2.2"/><line class="detail" x1="${a - 1.4}" y1="${b}" x2="${a + 1.4}" y2="${b}"/>`; });
  return s + '</g>';
}
/* flat road strip on a plate top. axis 'x': runs along x */
function road(K, x, y, w, d, z, axis = 'x') {
  let s = `<g transform="${K.TOP(x, y, z)}"><rect class="face recess" width="${w}" height="${d}"/>`;
  s += axis === 'x' ? `<line class="detail dash" x1="4" y1="${d / 2}" x2="${w - 4}" y2="${d / 2}"/>` : `<line class="detail dash" x1="${w / 2}" y1="4" x2="${w / 2}" y2="${d - 4}"/>`;
  return s + '</g>';
}
/* window panes on a plane */
function wins(t, w, h, cols, rows, rnd, lit = false) {
  const pw = w / cols, ph = h / rows; let s = `<g class="wins${lit ? ' lit' : ''}" transform="${t}">`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const v = rnd(); s += `<rect class="pn${v < .12 ? ' x' : v < .3 ? ' d' : v < .42 ? ' h' : ''}" x="${f1(c * pw + .7)}" y="${f1(r * ph + .8)}" width="${f1(pw - 1.4)}" height="${f1(ph - 1.6)}"/>`; }
  return s + '</g>';
}
/* a building: box with window grids on FRONT and SIDE */
function bldg(K, x, y, w, d, h, rnd, o = {}) {
  const z = o.z === undefined ? 6 : o.z, pad = 3, cw = o.cw || 7, rh = o.rh || 8;
  let s = K.box(x, y, z, w, d, h, o.r === undefined ? 1.5 : o.r);
  s += `<g transform="${K.TOP(x, y, z + h)}"><rect class="detail" x="2.5" y="2.5" width="${w - 5}" height="${d - 5}"/></g>`;
  const cF = Math.max(2, Math.round((w - 2 * pad) / cw)), cS = Math.max(2, Math.round((d - 2 * pad) / cw)), rows = Math.max(2, Math.floor((h - 8) / rh));
  s += wins(K.FRONT(x + pad, y + d, z + h - 5), w - 2 * pad, rows * rh - 2, cF, rows, rnd, o.lit);
  s += wins(K.SIDE(x + w, y + d - pad, z + h - 5), d - 2 * pad, rows * rh - 2, cS, rows, rnd, o.lit);
  return s;
}
function tree(K, x, y, z = 6, r = 7) {
  const a = K.P(x, y, z + 1), b = K.P(x, y, z + 9), c = K.P(x, y, z + 9 + r * .8);
  return `<path class="mast" d="M${a.map(f1).join(' ')}L${b.map(f1).join(' ')}"/><circle class="face" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${r}"/><circle class="detail" cx="${f1(c[0] - r * .2)}" cy="${f1(c[1] - r * .2)}" r="${f1(r * .5)}"/>`;
}
/* little person, feet at (x,y,z). o: hat 'cap'|'hard', vest, hold [x,y,z], up, cls */
function person(K, x, y, z, o = {}) {
  const { box, P, FRONT } = K; let s = `<g class="person ${o.cls || ''}">`;
  s += box(x - 3.2, y - 1.8, z, 6.4, 3.6, 9, .8);
  s += `<g transform="${FRONT(x - 3.2, y + 1.8, z + 9)}"><line class="detail" x1="3.2" y1="1" x2="3.2" y2="9"/></g>`;
  s += box(x - 3.8, y - 2.2, z + 9, 7.6, 4.4, 9.5, 1.2);
  if (o.vest) s += `<g transform="${FRONT(x - 3.8, y + 2.2, z + 18.5)}"><line class="detail" x1="2" y1="0" x2="2" y2="9.5"/><line class="detail" x1="5.6" y1="0" x2="5.6" y2="9.5"/><line class="detail" x1="0" y1="6" x2="7.6" y2="6"/></g>`;
  const L = P(x - 4.2, y, z + 17.6), R = P(x + 4.2, y, z + 17.6);
  const hl = o.hold ? P(o.hold[0] - 1.6, o.hold[1], o.hold[2]) : o.up ? P(x - 5.5, y, z + 25.5) : P(x - 4.6, y, z + 9.5);
  const hr = o.hold ? P(o.hold[0] + 1.6, o.hold[1], o.hold[2]) : o.up ? P(x + 5.5, y, z + 25.5) : P(x + 4.6, y, z + 9.5);
  s += `<path class="limb" d="M${L.map(f1).join(' ')}L${hl.map(f1).join(' ')}M${R.map(f1).join(' ')}L${hr.map(f1).join(' ')}"/>`;
  const h = P(x, y, z + 22.8);
  s += `<circle class="face" cx="${f1(h[0])}" cy="${f1(h[1])}" r="3.6"/>`;
  if (o.hat) s += `<path class="face" d="M${f1(h[0] - 3.9)} ${f1(h[1] - .4)}A3.9 3.9 0 0 1 ${f1(h[0] + 3.9)} ${f1(h[1] - .4)}Z"/>` + (o.hat === 'hard' ? `<line class="detail" x1="${f1(h[0] - 5)}" y1="${f1(h[1] - .4)}" x2="${f1(h[0] + 5)}" y2="${f1(h[1] - .4)}"/>` : '');
  return s + '</g>';
}
/* a seated/standing spectator: head + shoulders */
function spectator(K, x, y, z, up) {
  const h = K.P(x, y, z + 11), sh = K.P(x, y, z + 7);
  return K.box(x - 2.2, y - 1.6, z, 4.4, 3.2, 8, 1.1) + `<circle class="face" cx="${f1(h[0])}" cy="${f1(h[1])}" r="2.5"/>` + (up ? `<path class="limb" style="stroke-width:1.5" d="M${K.P(x + 2.2, y, z + 7).map(f1).join(' ')}L${K.P(x + 3.4, y, z + 14).map(f1).join(' ')}"/>` : '');
}
/* parcel box with tape; z = base */

    `<g transform="${K.FRONT(x, y + d, z + h)}"><line class="detail" x1="${f1(w / 2)}" y1="0" x2="${f1(w / 2)}" y2="${f1(h * .45)}"/></g></g>`;

/* delivery van parked with its rear at x0, cab toward +x, centre line yc, ground zb. Returns {back, front}; boxes live between. */
function van(K, x0, yc, zb = 6, o = {}) {
  const { box, FRONT, SIDE, rect } = K, W = 28, y0 = yc - W / 2;
  const back = box(x0, y0, zb + 4, 75, W, 6, 1.5) + box(x0, y0, zb + 10, 50, 2, 9, 0) + (o.open ? '' : box(x0, y0, zb + 10, 2, W, 9, 0));
  let front = box(x0, y0 + W - 2, zb + 10, 50, 2, 9, 0) + box(x0 + 50, y0, zb + 10, 25, W, 18, 3);
  front += rect(FRONT(x0 + 54, y0 + W, zb + 26.5), 17, 7, 1.5, 'face glass') + rect(SIDE(x0 + 75, y0 + W - 3, zb + 26.5), 16, 7, 1.5, 'face glass');
  front += `<g transform="${SIDE(x0 + 75, y0 + W - 3, zb + 15)}"><rect class="led ${o.lamp || ''}" filter="url(#soft)" x="0" y="0" width="4" height="2.4" rx="1"/><rect class="led ${o.lamp || ''}" filter="url(#soft)" x="18" y="0" width="4" height="2.4" rx="1"/></g>`;

/* floating data icons rising from source points; returns {set(on), burst()} */
function emitter(api, K, root, src, o = {}) {
  const n = o.n || 6, rise = o.rise || 60, per = o.period || 3600, kinds = o.kinds || KINDS, sc0 = o.s || 1;
  root.innerHTML = Array.from({ length: n }, (_, i) => icon(kinds[i % kinds.length])).join('');
  const els = [...root.children]; els.forEach(e => { e.style.opacity = 0; });
  let on = o.on !== false, gain = on ? 1 : 0, last = 0;
  api.loop(t => {
    const dt = Math.min(64, t - last); last = t; gain += ((on ? 1 : 0) - gain) * Math.min(1, dt / 260);
    els.forEach((el, i) => {
      const s = src[i % src.length], u = (t / per + i / n) % 1, a = Math.pow(Math.sin(Math.PI * u), .55) * gain;

}

  let accent = +store.get('iso-accent') || 0, theme = store.get('iso-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  function applyTheme() {
    root.dataset.theme = theme; const p = pal[accent] || pal[0], L = theme === 'light';
    root.style.setProperty('--accent', L ? p[3] : p[1]); root.style.setProperty('--accent-hi', L ? p[4] : p[2]);
    $('#pal').innerHTML = pal.map((q, i) => `<button class="sw" type="button" title="${q[0]}" aria-label="${q[0]}" aria-pressed="${i === accent}" data-i="${i}" style="background:${L ? q[3] : q[1]}"></button>`).join('');
  }
  $('#pal').addEventListener('click', e => { const b = e.target.closest('.sw'); if (b) { accent = +b.dataset.i; store.set('iso-accent', accent); applyTheme(); } });
  $('#theme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; store.set('iso-theme', theme); applyTheme(); };
  applyTheme();

  document.head.insertAdjacentHTML('beforeend', `<style id="figcss">${FIGS.map(f => f.css || '').join('\n')}</style>`);

  let stage = $('#stage'), cur = null; const timers = new Set(), intervals = new Set(), stops = new Set();
  function clearAll() { timers.forEach(clearTimeout); intervals.forEach(clearInterval); stops.forEach(f => f()); timers.clear(); intervals.clear(); stops.clear(); }
  const api = {
    iso: ISO, esc: ISO.esc,
    readout: s => { ro.textContent = s; },
    audio() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(), out = ctx.createGain(), analyser = ctx.createAnalyser(); out.connect(analyser); analyser.connect(ctx.destination); return { ctx, out, analyser }; } catch (e) { return null; } },
    after(ms, fn) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; },
    every(ms, fn) { const id = setInterval(fn, ms); intervals.add(id); return id; },
    loop(fn) { let on = true, id; const f = t => { if (!on) return; fn(t); id = requestAnimationFrame(f); }; id = requestAnimationFrame(f); const stop = () => { on = false; cancelAnimationFrame(id); }; stops.add(stop); return stop; },
    flash(el) { el.classList.add('down', 'lit'); setTimeout(() => el.classList.remove('down'), 110); setTimeout(() => el.classList.remove('lit'), 420); },
    replay(el, c = 'go') { el.classList.remove(c); void el.getBoundingClientRect(); el.classList.add(c); },
    power(on) { holder.classList.toggle('on', !!on); },
  };

  const nav = $('#nav');
  nav.innerHTML = FIGS.map((f, i) => `<li><button type="button" data-i="${i}"><i>${String(i + 1).padStart(2, '0')}</i>${ISO.esc(f.name)}</button></li>`).join('');
  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(+b.dataset.i); });

  function select(i) {
    if (cur && cur.inst.unmount) { try { cur.inst.unmount(); } catch (e) {} }
    clearAll(); ro.textContent = ''; holder.classList.remove('on');
    const f = FIGS[i], s = document.createElementNS(NS, 'svg');
    s.id = 'stage'; s.setAttribute('class', 'stage'); s.setAttribute('role', 'img'); s.setAttribute('tabindex', '0');
    s.setAttribute('aria-label', f.aria || f.name); s.dataset.fig = f.id;
    stage.replaceWith(s); stage = s;
    const inst = f.mount(stage, api) || {}; cur = { i, f, inst };
    stage.addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (inst.key && inst.key(e)) e.preventDefault(); });
    stage.addEventListener('keyup', e => { if (inst.keyup) inst.keyup(e); });
    nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', +b.dataset.i === i));
    $('#figlabel').innerHTML = `Fig ${i + 1} · <b>${ISO.esc(f.name)}</b>`;
    $('#hint').textContent = f.hint || ''; $('#shot').textContent = f.shot || ''; $('#vo').textContent = f.vo ? '“' + f.vo + '”' : ''; $('#vis').textContent = f.visual || '';
    document.title = `${f.name} · Data mesh storyboard`; try { history.replaceState(null, '', '#' + f.id); } catch (e) {}
    stage.focus({ preventScroll: true });
    if (inst.demo && (GALLERY.autoDemo || /[?&]demo/.test(location.search))) api.after(350, () => inst.demo());
  }
  addEventListener('keydown', e => {
    if (e.target !== document.body || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ']' || e.key === 'PageDown') select(Math.min(FIGS.length - 1, cur.i + 1));
    if (e.key === '[' || e.key === 'PageUp') select(Math.max(0, cur.i - 1));
  });

  $('#dl').onclick = () => {
    const cs = getComputedStyle(root), names = ['--panel', '--body', '--deck', '--line', '--detail', '--recess', '--ink', '--ink-hi', '--glass', '--glass-on', '--accent', '--accent-hi', '--accent-dim'];
    const vars = names.map(k => `${k}:${cs.getPropertyValue(k).trim()}`).join(';');
    const c = stage.cloneNode(true), vb = stage.getAttribute('viewBox').split(' ').map(Number);
    ['tabindex', 'role', 'style'].forEach(a => c.removeAttribute(a)); c.setAttribute('xmlns', NS); c.setAttribute('width', 1200); c.setAttribute('height', 900);
    c.setAttribute('aria-label', cur.f.aria || cur.f.name); c.setAttribute('role', 'img');
    const css = `svg.stage{${vars}}\n` + $('#vocab').textContent + '\n' + (cur.f.css || '');
    c.insertAdjacentHTML('afterbegin', `<style>${css}</style><defs>${$('#fx').innerHTML}</defs><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" style="fill:var(--panel);vector-effect:none"/>`);
    const a = document.createElement('a'); a.download = `shot-${cur.i + 1}-${cur.f.id}.svg`;
    a.href = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)], { type: 'image/svg+xml' })); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  const h = location.hash.slice(1), start = FIGS.findIndex(f => f.id === h);
  select(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
